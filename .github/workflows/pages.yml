name: Publish demo and research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build holds no deploy capability: `npm ci` runs third-party install scripts and the research build
  # runs project scripts, so this job must not be able to publish to Pages or mint a Pages OIDC token
  # (idb-vector-yfdc). The two grants live on `deploy`, which only downloads this job's artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:research
      # research/index.html is generated, and the staging step publishes the committed page, so the
      # generated one must be the committed one: without this check a builder change that forgets to
      # regenerate the page would ship stale content. Runs before staging, on the worktree.
      - name: Check the built research page matches its committed bytes
        run: git diff --exit-code -- research/index.html
      - uses: actions/configure-pages@v5
      - name: Stage public demo, library and research from the published commit
        run: |
          # demo/ ships whole; index.js and utils/*.js are derived from what demo/app.js imports
          # (tools/stage-site.mjs), so a new utils/ module reaches the live site without an edit here.
          #
          # Every published path is tracked in the commit: demo/ entire, the derived library modules,
          # and research/ - whose index.html the step above holds to its committed bytes. So the tree
          # is extracted from that commit instead of copied out of the worktree, where `npm ci` has
          # just run third-party install scripts and the research build ran project scripts. A
          # postinstall that rewrites demo/app.js, or a build step that rewrites demo/index.html, then
          # writes a file nothing publishes, and demo/integrity.js's trust root - the repository
          # commit that ships this code - holds for the bytes on the live site (idb-vector-5yqb). The
          # stager runs from the extracted tree too, so the code that picks the published files is
          # committed code. No .gitattributes export-ignore exists, so the archive is the whole tree.
          #
          # Both roots are deleted first. They are ordinary worktree paths, so the install and build
          # steps above can write files into them, and neither mistake is contained by the extraction:
          # `tar -x` only overlays, and the upload publishes `site` whole. A postinstall that left
          # .site-src/demo/preseed.js or site/preseed.html behind would therefore ship it under the
          # commit's trust root without touching a tracked byte - the same break one level sideways
          # (idb-vector-5yqb review). After the delete, only the extraction and the stager write here.
          set -o pipefail
          rm -rf .site-src site
          mkdir -p .site-src
          git archive "$GITHUB_SHA" | tar -x -C .site-src
          (cd .site-src && node tools/stage-site.mjs ../site)
          cp -r .site-src/research site/research
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><a href="./demo/">Open the Wikipedia search demo</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
