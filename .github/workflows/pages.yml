name: Publish demo and research
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:research
      - run: git diff --exit-code -- research/index.html
      - uses: actions/configure-pages@v5
      - name: Stage public demo, library and research
        run: |
          # demo/ ships whole; index.js and utils/*.js are derived from what demo/app.js imports
          # (tools/stage-site.mjs), so a new utils/ module reaches the live site without an edit here.
          node tools/stage-site.mjs site
          cp -r research site/research
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=./demo/"><a href="./demo/">Open the Wikipedia search demo</a>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
