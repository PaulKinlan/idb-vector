# The 100000x128 packed-snapshot measurement, kept OUT of the merger's full gate.
#
# It used to run inside `npm run test:packed`, where it pushed the full gate past 900s at host load ~10
# (37% of its 2400s allowance) to check something the small corpora already prove: that a packed cache
# returns bit-identical keys, scores and order to the plain scan (idb-vector-bqw, ADR idb-vector-80j).
# This workflow is the owner of the size-dependent check. It runs weekly, on changes to the
# packed-snapshot path, and on demand, and it uploads the evidence directory the run prints.
name: Packed snapshot stress

on:
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  push:
    branches: [main]
    paths:
      - 'utils/packed-snapshot.js'
      - 'utils/sortedarray.js'
      - 'utils/geometry.js'
      - 'index.js'
      - 'tools/demo-server.mjs'
      - 'tests/packed-snapshot-stress.mjs'
      - '.github/workflows/packed-stress.yml'
  workflow_dispatch:
    inputs:
      count:
        description: 'Corpus size in vectors (default 100000)'
        required: false
        default: '100000'

permissions:
  contents: read

concurrency:
  group: packed-stress
  cancel-in-progress: false

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PACKED_SNAPSHOT_STRESS_DIR: ${{ runner.temp }}/packed-stress
      PACKED_SNAPSHOT_STRESS_COUNT: ${{ inputs.count || '100000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Headless Chrome is preinstalled on the runner and tests/lib/cdp.mjs finds it at
      # /usr/bin/google-chrome; IDB_VECTOR_CHROME overrides the search if that ever changes.
      - name: Measure 100000x128 packed snapshot
        run: npm run measure:packed-snapshot
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: packed-snapshot-stress
          path: ${{ env.PACKED_SNAPSHOT_STRESS_DIR }}
          if-no-files-found: warn
